name: CI

# Typecheck, tests (incluyen tests de integración con git real) y empaquetado del .vsix
# en cada push a main y en cada pull request.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Los tests crean repositorios temporales y hacen commits en ellos.
      - name: Configure git for the tests
        shell: bash
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package
        if: matrix.os == 'ubuntu-latest'
        run: npm run package -- --out multigit.vsix

      - name: Upload vsix
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: multigit-vsix
          path: multigit.vsix

  e2e:
    name: Tests en VS Code (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      # VS Code necesita una pantalla: xvfb crea una virtual. Si falla, el final de la salida se
      # publica como anotación (visible sin abrir los logs).
      - name: Extension tests
        shell: bash
        run: |
          set +e
          xvfb-run -a npm run test:e2e 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=e2e (últimas líneas)::$(tail -40 e2e.log | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"
          fi
          exit "$status"
